[package]
name = "spider"
version = "1.0.1"
edition = "2024"
description = "Spider: Discord Rich Presence without a token (debug port + IPC pipe), up to three cards"
license = "MIT"
# let-chains (`if let .. && let ..`) need Rust 1.88.
rust-version = "1.88"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
crossterm = { version = "0.29", default-features = false, features = ["events", "windows"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
